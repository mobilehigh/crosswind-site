<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crosswind</title>
<meta name="description" content="Crosswind, an endless flying game for Android.">
<style>
  :root { --bg: #F4F7FA; --fg: #14202E; --muted: #4E5E70; --accent: #D9480F; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0B1626; --fg: #E6EDF5; --muted: #9AACC2; --accent: #FF7840; color-scheme: dark; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 40rem; margin: 0 auto; padding: 3rem 1.25rem; }
  h1 { margin: 0 0 0.5rem; font-size: 2.4rem; line-height: 1.1; }
  p { margin: 0 0 1rem; color: var(--muted); }
  ul { padding-left: 1.2rem; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Crosswind</h1>
  <p>An endless flying game for Android. Hold to climb, let go to descend, and dodge everything
  in the sky.</p>
  <ul>
    <li><a href="privacy-policy.html">Privacy policy</a></li>
  </ul>
